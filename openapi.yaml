openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: 'API da plataforma Connecta. Autenticação via Bearer Token (Laravel Passport). Rotas de empresa exigem o header Authorization com o token do usuário.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Autenticação
    description: "\nLogin, registro de usuário e recuperação de senha."
  -
    name: 'Admin — Empresas'
    description: "\nGestão de empresas pelo painel administrativo."
  -
    name: 'Admin — Usuários'
    description: "\nGestão de usuários operadores pelo painel administrativo."
  -
    name: Localização
    description: "\nCidades e estados disponíveis no sistema."
  -
    name: Empresa
    description: "\nDados da empresa cliente do tenant."
  -
    name: 'Empresa — Setores'
    description: "\nCRUD de setores da empresa."
  -
    name: 'Empresa — Cargos'
    description: "\nCRUD de cargos e vinculação com setores."
  -
    name: 'Empresa — Pessoas'
    description: "\nCRUD de colaboradores (pessoas) da empresa."
  -
    name: 'Empresa — Níveis e Permissões'
    description: "\nNíveis de acesso e permissões dos usuários."
  -
    name: Pesquisas
    description: "\nTipos, criação e gestão de pesquisas e formulários."
  -
    name: Formulários
    description: "\nCriação e edição de formulários com perguntas e opções."
  -
    name: Respondentes
    description: "\nGestão de respondentes vinculados a pesquisas."
  -
    name: Respostas
    description: "\nEnvio e consulta de respostas de pesquisas."
  -
    name: Dashboard
    description: "\nTotais e métricas consolidadas para o dashboard."
  -
    name: Competências
    description: "\nCRUD de competências avaliadas nas pesquisas."
  -
    name: Anotações
    description: "\nAnotações de avaliadores vinculadas a envios."
  -
    name: PDI
    description: ''
  -
    name: 'PDI — Lote'
    description: ''
  -
    name: 'PDI — E-mail'
    description: ''
  -
    name: 'PDI — Recursos'
    description: "\nLivros e vídeos recomendados por competência no PDI."
  -
    name: Outros
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Faça login via <code>POST /api/login</code> e use o token retornado como Bearer no header <code>Authorization</code>.'
security:
  -
    default: []
paths:
  /api/register:
    post:
      summary: 'User registration'
      operationId: userRegistration
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: kunde.eloisa@example.com
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '4[*UyPJ"}6'
              required:
                - name
                - email
                - password
  /api/login:
    post:
      summary: 'Login api'
      operationId: loginApi
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Autenticação
  /api/me:
    get:
      summary: 'Login user'
      operationId: loginUser
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Internal server error.'
                  error: Unauthenticated.
                  line: 102
                  file: /home/paulo/Documentos/desenvolvimento/connecta-back/vendor/laravel/framework/src/Illuminate/Auth/Middleware/Authenticate.php
                properties:
                  message:
                    type: string
                    example: 'Internal server error.'
                  error:
                    type: string
                    example: Unauthenticated.
                  line:
                    type: integer
                    example: 102
                  file:
                    type: string
                    example: /home/paulo/Documentos/desenvolvimento/connecta-back/vendor/laravel/framework/src/Illuminate/Auth/Middleware/Authenticate.php
      tags:
        - Autenticação
